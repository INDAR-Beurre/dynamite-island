# Dynamite Island configuration — copy to ~/.config/dynamite-rust/config.conf
# Every value is read live; the settings app and the "reload" remote rewrite
# and apply this file without restarting the island.

# Geometry
gap_top=3               # px between the screen edge and the pill
bar_height=24           # pill height
collapsed_width=76      # pill width when collapsed
expanded_height=150     # default panel height
inner_padding=14        # panel content padding
notch_mode=0            # 1 = notch-style cutout rendering

# Behaviour
hover_open=0            # 1 = open on hover (0 = click only)
scroll_cycle=1          # wheel over the pill cycles views
clock_24h=1
anim_ms=160             # expand/collapse morph duration (reference: 130-230)

# Appearance (set by the Wallpapers / Themes views when you pick one)
accent=#7CA2F5
wallpaper=
theme=

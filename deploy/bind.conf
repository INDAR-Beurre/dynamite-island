# Dynamite island — key bindings for MangoWM.
#
# APPEND these lines to ~/.config/mango/bind.conf. Do not copy this file
# over it: your bind.conf holds every other binding you have.
#
# The panel takes its state as argv[1], so a binding is just a spawn.
# Replace /path/to/rust-island-build with your checkout, or run
# deploy/install.sh to generate the absolute paths.
#
#   source = ~/.config/mango/dynamite-bind.conf
#
# MangoWM does not expand variables inside a bind line, so the absolute
# path is required. `deploy/install.sh` rewrites it for you.

# Open the app launcher.
bind=SUPER,space,spawn,/path/to/rust-island-build/target/release/dynamite-rust launcher
# Open the clipboard history.
bind=SUPER,v,spawn,/path/to/rust-island-build/target/release/dynamite-rust clipboard

# Everything else is driven by the pointer (hover/click the island) or by
# the socket words in docs/socket-contract.md. Useful extras:
#
#   bind=SUPER,i,spawn,/path/to/rust-island-build/target/release/dynamite-rust themes
#   bind=SUPER,w,spawn,/path/to/rust-island-build/target/release/dynamite-rust wallpaper
#   bind=SUPER,m,spawn,/path/to/rust-island-build/target/release/dynamite-rust music
#
# The panel's lockscreen command is a preview, not a session lock. For the
# optional Hyprlock + Howdy command and attended setup, see deploy/README.md.